services:
  postgres: 
    image: pgvector/pgvector:pg15
    container_name: adk-postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: adk_user
      POSTGRES_PASSWORD: adk_password
      POSTGRES_DB: adk_history
    networks:
      - graphnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adk_user -d adk_history"] # Check both user AND db
      interval: 5s
      timeout: 5s
      retries: 5
  
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dyresearch-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - config.env
    volumes:
      # Works dynamically for both Windows and Mac paths
      - ${OBSIDIAN_VAULT_PATH}:${OBSIDIAN_VAULT_PATH}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - graphnet

volumes:
  pg_data: 

networks:
  graphnet:
    driver: bridge